[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clearancewatch"
version = "0.2.0"
description = "Track subcontractor compliance per job: WSIB/WCB clearance coverage, insurance and licence expiry against the job calendar"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Calas Automations Inc." }]
maintainers = [{ name = "Calas Automations Inc." }]
keywords = ["wsib", "wcb", "clearance", "compliance", "construction", "trades", "insurance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/clearancewatch"
Source = "https://github.com/calasdan-sketch/clearancewatch"
Issues = "https://github.com/calasdan-sketch/clearancewatch/issues"
Changelog = "https://github.com/calasdan-sketch/clearancewatch/blob/main/CHANGELOG.md"

[project.scripts]
clearancewatch = "clearancewatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clearancewatch = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
