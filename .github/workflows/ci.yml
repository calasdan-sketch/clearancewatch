name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest build twine ruff mypy
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: clearancewatch --version
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Tests pass from the source distribution
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir sdist-check
          tar xzf dist/*.tar.gz -C sdist-check
          cd sdist-check/clearancewatch-*
          pip install pytest
          python -m pytest -q
